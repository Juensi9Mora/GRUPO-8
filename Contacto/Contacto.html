<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Compañeros de Vida</title>
    <link rel="stylesheet" href="../navbar/navbar.css">
    <link rel="stylesheet" href="../footer/footer.css">
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="Contacto.css">
</head>
<body>
    <header id="navbar-container"></header>


    <main class="seccion-dividida">
        <div class="texto-izq">
            <h1>Contacto</h1>
            <h2>¿Quieres adoptar o ayudar?</h2>
            <p>Escríbenos si quieres adoptar, ser hogar de paso o apoyar a un albergue. Te responderemos lo antes posible.</p>
            <p class="dato-contacto"><strong>Correo:</strong> contacto@companerosdevidafalso.com</p>
        </div>
        <div class="formulario-der">
            <form class="formulario-contacto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos en qué podemos ayudarte" required></textarea>

                <button type="submit">Enviar mensaje</button>
            </form>
        </div>
    </main>
        <div id="footer-container"></div>
    <script>
        fetch('../navbar/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            });
            fetch('../footer/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });

    </script>

</body>
</html>
